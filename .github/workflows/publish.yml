name: Publish to NuGet

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'

  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force NuGet publish (bypass version check)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore IronHive.Agent.slnx

    - name: Build
      run: dotnet build IronHive.Agent.slnx --configuration Release --no-restore

    - name: Run tests
      # --hangdump/--hangdump-timeout is MTP's equivalent of VSTest's --blame-hang (native MTP
      # mode via global.json needs no -- separator before it). --blame-hang turned a silent ride
      # to the job's 20-minute timeout-cancel into a 5-minute dump naming the hung test (same
      # job-timeout shape observed directly on ironhive/ironhive's nuget-publish.yml, run
      # 33171897265, 2026-08-28).
      run: dotnet test --solution IronHive.Agent.slnx --configuration Release --no-build --verbosity normal --hangdump --hangdump-timeout 5m

    - name: Extract version from Directory.Build.props
      id: extract_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Check if any package needs publishing
      id: check_version
      if: ${{ !inputs.force_publish }}
      run: |
        VERSION="${{ steps.extract_version.outputs.version }}"
        echo "Checking version $VERSION on NuGet.org..."

        PACKAGES=(
          "IronHive.Agent"
          "IronHive.DeepResearch"
        )

        NEEDS_PUBLISH=false
        for PACKAGE in "${PACKAGES[@]}"; do
          # Ask the flat container for the exact nupkg: 200 means this version is already published.
          # (`dotnet nuget search` is not a command in the current SDK; its failure was swallowed by
          # `|| true` and read as "not found", so this check reported every version as unpublished.)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/${VERSION}/${PACKAGE,,}.${VERSION}.nupkg")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "$PACKAGE version $VERSION not found (HTTP $HTTP_STATUS) - needs publishing"
            NEEDS_PUBLISH=true
          else
            echo "$PACKAGE version $VERSION already exists"
          fi
        done

        if [ "$NEEDS_PUBLISH" = true ]; then
          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "At least one package needs publishing"
        else
          echo "should_publish=false" >> $GITHUB_OUTPUT
          echo "All packages version $VERSION already exist on NuGet.org"
        fi

    # Hand the packages over only if a version is new or force_publish is true
    - name: Decide whether to publish
      id: decide
      run: |
        if [ "${{ steps.check_version.outputs.should_publish }}" == "true" ] || [ "${{ inputs.force_publish }}" == "true" ]; then
          echo "publish=true" >> $GITHUB_OUTPUT
        else
          echo "publish=false" >> $GITHUB_OUTPUT
        fi

    - name: Pack all NuGet packages
      if: ${{ steps.decide.outputs.publish == 'true' }}
      run: |
        mkdir -p ./packages

        # The solution, not each project: every packable project of the family is packed at the same
        # version, so a new package cannot be left out of a release.
        echo "Packing the IronHive.Agent family..."
        dotnet pack IronHive.Agent.slnx \
          --configuration Release \
          --no-build \
          --output ./packages

        echo "All packages created"
        ls -lh ./packages/

    # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
    - name: Upload packages
      if: ${{ steps.decide.outputs.publish == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        if-no-files-found: error
        retention-days: 1

    - name: Summary
      if: always()
      run: |
        echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Force Publish**: ${{ inputs.force_publish || 'false' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.decide.outputs.publish }}" == "true" ]; then
          echo "- **Status**: Handed to the central publisher" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: Skipped (version already exists)" >> $GITHUB_STEP_SUMMARY
        fi

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # tag + GitHub release
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
    # verbatim; change it in all of them or in none.
    - name: GitHub release (notes = this version's CHANGELOG section)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
        if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
        awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
        gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
